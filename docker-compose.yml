services:

  postgres:
    image: postgres:17

    container_name: huelli-postgres

    hostname: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Lima
      PGTZ: America/Lima

    ports:
      - "5432:5432"

    volumes:
      # Persistencia de datos
      - ./postgres/data:/var/lib/postgresql/data

      # Scripts de inicialización (solo primera ejecución)
      - ./postgres/init:/docker-entrypoint-initdb.d

      # Backups
      - ./postgres/backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huelli -d huelli_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      huelli-network:
        aliases:
          - postgres
          - postgres-db

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: huelli-pgadmin

    hostname: pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5050:80"

    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgadmin4/pgpass
      - ./pgadmin/data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      huelli-network:
        aliases:
          - pgadmin

networks:

  huelli-network:
    name: huelli-network
    driver: bridge